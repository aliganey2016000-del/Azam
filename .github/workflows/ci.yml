name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azam
          POSTGRES_PASSWORD: azam_ci_password
          POSTGRES_DB: azam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azam -d azam_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://azam:azam_ci_password@localhost:5432/azam_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-change-me-123456789012345
      JWT_REFRESH_SECRET: ci-only-refresh-secret-change-me-123456789012345
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Generate Prisma Client
        run: npm run prisma:generate --prefix backend

      - name: Apply Prisma migrations
        run: npm run prisma:migrate:deploy --prefix backend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Test backend
        run: npm test --prefix backend

      - name: Typecheck frontend
        run: npx tsc --noEmit --project frontend/tsconfig.json

      - name: Build frontend
        run: npm run build --prefix frontend
